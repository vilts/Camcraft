# Release build (M1.7e, M13.3): a v* tag builds Windows, Linux, macOS,
# and FreeBSD.
# Linux packages TAR.GZ, DEB, RPM, AppImage, Snap, and Flatpak; macOS packages
# a universal app as ZIP and DMG; FreeBSD an amd64 tarball; Windows assembles
# its zip (cargo xtask package) and installer.
# Signing is optional and secret-gated (scripts/sign.ps1): with no
# CAMCRAFT_SIGN_* secret the binaries ship unsigned, as every release so
# far has. The decision is logged in RECOMMENDED.md ("M13.3").
# Only MAJOR and MINOR tags build (vX.Y.0): a patch tag (vX.Y.Z, Z > 0) is
# pushed as a marker and builds nothing - the Actions budget is spent on
# releases that carry features (AGENTS.md "Versioning is semantic").
# workflow_dispatch builds any ref by hand (it builds every platform but
# publishes nothing: only a tag run reaches the publish job).
# Graph (#125): windows, linux, macos and freebsd start at once; AUR, snap
# and flatpak follow Linux; publish waits for all seven with !cancelled(),
# puts every asset that was built on the release page and names any
# platform whose build failed, so one broken package never withholds the rest.
# Docs site (#688): `site` builds the Zola site in site/ from the same tree
# alongside the platform builds; `pages` deploys it to GitHub Pages only on
# a tag run and only once `publish` has put the release page up, so the
# site's download links never point at a release that is not there.
# Browser build (#1103): `wasm` builds the shell for wasm32 from the same
# tree and hands the page folder to `site`, which serves it at app/. A
# failed wasm build leaves app/ as the site's own "not part of this copy"
# page and a warning in the run; the docs and the release go out anyway.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.0']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Build jobs only read the repo. Creating a GitHub Release and uploading
# its assets needs write access to the repo's contents (403 "Resource not
# accessible by integration" on v0.8.1's first run): only the publish job
# gets it.
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build and package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libx11-dev rpm imagemagick
      - name: Build release binaries
        run: cargo build --locked --release -p camcraft-ui -p camcraft-app -p camcraft-post
      - name: Assemble Linux packages
        run: scripts/package-linux.sh
      - name: Install pinned linuxdeploy
        run: |
          curl -LfsS -o /tmp/linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  /tmp/linuxdeploy-x86_64.AppImage' | sha256sum -c -
          chmod +x /tmp/linuxdeploy-x86_64.AppImage
      - name: Assemble AppImage
        env:
          LINUXDEPLOY: /tmp/linuxdeploy-x86_64.AppImage
        run: scripts/package-appimage.sh
      - name: Check package contents
        run: |
          tar -tzf dist/*.tar.gz | grep '/camcraft-ui$'
          dpkg-deb --contents dist/*.deb | grep '/usr/lib/camcraft/camcraft-ui$'
          rpm -qpl dist/*.rpm | grep '/usr/lib/camcraft/camcraft-ui$'
          test -s dist/*.AppImage
          # This runner has no GPU adapter, so compare the packaged ELF to
          # the binary we just built. This catches linuxdeploy's .init damage.
          appimage_check=$(mktemp -d "$RUNNER_TEMP/camcraft-appimage.XXXXXX")
          (cd "$appimage_check" && "$GITHUB_WORKSPACE"/dist/*.AppImage --appimage-extract)
          cmp target/release/camcraft-ui "$appimage_check/squashfs-root/usr/bin/camcraft-ui"
          test -x "$appimage_check/squashfs-root/AppRun"
          test -d "$appimage_check/squashfs-root/usr/bin/assets/themes"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  macos:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install Apple Silicon and Intel Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build universal release binaries
        run: |
          cargo build --locked --release --target aarch64-apple-darwin -p camcraft-ui -p camcraft-app -p camcraft-post
          cargo build --locked --release --target x86_64-apple-darwin -p camcraft-ui -p camcraft-app -p camcraft-post
      - name: Assemble macOS app and disk image
        run: scripts/package-macos.sh
      - name: Check macOS package contents
        run: |
          unzip -l dist/*-macos-universal.zip | grep 'CamCraft.app/Contents/MacOS/camcraft-ui'
          hdiutil imageinfo dist/*-macos-universal.dmg >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            dist/*-macos-universal.zip
            dist/*-macos-universal.dmg
          if-no-files-found: error

  freebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build and package in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14'
          cpu: 3
          mem: 5120
          run: |
            pkg install -y bash rust pkgconf libxkbcommon libX11 wayland vulkan-loader mesa-libs
            export CARGO_TARGET_DIR=/tmp/camcraft-target
            cargo build --locked --release -p camcraft-ui -p camcraft-app -p camcraft-post
            "$CARGO_TARGET_DIR/release/camcraft-cli" --version
            "$CARGO_TARGET_DIR/release/post" --version
            CAMCRAFT_BIN_DIR="$CARGO_TARGET_DIR/release" bash scripts/package-freebsd.sh
            tar -tzf dist/*-freebsd-amd64.tar.gz | grep '/camcraft-ui$'
      - name: Check copied archive
        run: test -s dist/*-freebsd-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-package
          path: dist/*-freebsd-amd64.tar.gz
          if-no-files-found: error

  aur:
    needs: linux
    uses: ./.github/workflows/aur-package.yml
    permissions:
      contents: read

  snap:
    needs: linux
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Install Snapcraft and SquashFS tools
        run: |
          sudo snap install snapcraft --classic
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
      - name: Assemble snap
        run: scripts/package-snap.sh
      - name: Check snap contents
        run: |
          unsquashfs -l dist/*.snap | grep '/camcraft-ui$'
          unsquashfs -l dist/*.snap | grep '/meta/snap.yaml$'
      - uses: actions/upload-artifact@v4
        with:
          name: snap-package
          path: dist/*.snap
          if-no-files-found: error

  flatpak:
    needs: linux
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Install Flatpak Builder and Freedesktop SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Assemble Flatpak bundle
        run: scripts/package-flatpak.sh
      - name: Check Flatpak bundle
        run: test -s dist/*.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-package
          path: dist/*.flatpak
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.zip.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        shell: bash
        run: cargo build --release -p camcraft-ui -p camcraft-app
          -p camcraft-post
      - name: Sign release binaries (no-op without a certificate secret)
        shell: pwsh
        # Optional repository secrets: CAMCRAFT_SIGN_CERT_BASE64 (a PFX,
        # base64-encoded) and CAMCRAFT_SIGN_CERT_PASSWORD. Absent, sign.ps1
        # prints "unsigned: no certificate configured" and the release goes
        # on. The PFX exists only in RUNNER_TEMP and is deleted below.
        env:
          CAMCRAFT_SIGN_CERT_BASE64: ${{ secrets.CAMCRAFT_SIGN_CERT_BASE64 }}
          CAMCRAFT_SIGN_CERT_PASSWORD: ${{ secrets.CAMCRAFT_SIGN_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:CAMCRAFT_SIGN_CERT_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "camcraft-sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CAMCRAFT_SIGN_CERT_BASE64))
            $env:CAMCRAFT_SIGN_CERT_PATH = $pfx
            "CAMCRAFT_SIGN_CERT_PATH=$pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }
          & scripts/sign.ps1 -Path target/release/camcraft-ui.exe, target/release/camcraft-cli.exe, target/release/post.exe
          if ($LASTEXITCODE -ne 0) { throw "sign.ps1 exited with $LASTEXITCODE" }
      - name: Assemble portable zip
        id: zip
        shell: bash
        # The layout lives once, in xtask (xtask/src/release_pack.rs, #752):
        # the same staging `cargo xtask release` uses locally. The version's
        # single truth is the binary we ship - xtask reads it from post.exe
        # --version - and goes to $GITHUB_OUTPUT (version, stage, zip) and
        # $GITHUB_ENV (CAMCRAFT_VERSION) for the steps below.
        run: |
          cargo xtask package --bin-dir target/release --out dist
          ls dist
      - name: Build installer (Inno Setup, same staged tree as the zip)
        shell: pwsh
        # windows-latest ships Inno Setup 6; -Required makes a missing ISCC
        # an error here (locally it is a named skip). With the certificate
        # secret set, installer.ps1 has ISCC sign the setup exe and the
        # uninstaller it embeds through sign.ps1 (CAMCRAFT_SIGN_CERT_PATH
        # comes from GITHUB_ENV, the password from this step's env).
        env:
          CAMCRAFT_SIGN_CERT_PASSWORD: ${{ secrets.CAMCRAFT_SIGN_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          & scripts/installer.ps1 -Version $env:CAMCRAFT_VERSION -Stage "${{ steps.zip.outputs.stage }}" -Required
          if ($LASTEXITCODE -ne 0) { throw "installer.ps1 exited with $LASTEXITCODE" }
          Get-ChildItem dist
      - name: Remove the signing certificate from the runner
        if: always()
        shell: pwsh
        run: |
          if ($env:CAMCRAFT_SIGN_CERT_PATH -and (Test-Path $env:CAMCRAFT_SIGN_CERT_PATH)) {
            Remove-Item -Force $env:CAMCRAFT_SIGN_CERT_PATH
          }
      - uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*-setup.exe
          if-no-files-found: error

  publish:
    # Runs after every build job whatever their result (but not on a
    # cancelled run), and only for a tag: a workflow_dispatch run builds
    # everything and publishes nothing.
    needs: [windows, linux, macos, freebsd, aur, snap, flatpak]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Every artifact the build jobs managed to upload, flattened into
      # dist/. A failed platform simply has none; the asset count below is
      # the guard, so an empty download does not end the job before it can
      # say so.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true
      - name: Version of this release
        shell: pwsh
        env:
          WIN_VERSION: ${{ needs.windows.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          # The Windows job reads the version from the post.exe it built; when
          # that job failed, the workspace manifest stands in (pwsh 7 parses
          # cargo metadata JSON fine; it was PowerShell 5.1 that did not).
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata exited with $LASTEXITCODE" }
          $ver = @($meta.packages | Where-Object { $_.name -eq 'camcraft-post' })[0].version
          if (-not $ver) { throw "cannot read camcraft-post's version from cargo metadata" }
          if ($env:WIN_VERSION -and $env:WIN_VERSION -ne $ver) {
            throw "post.exe says $env:WIN_VERSION but the manifest says $ver"
          }
          if ($env:TAG -ne "v$ver") { throw "tag $env:TAG does not name version v$ver" }
          "CAMCRAFT_VERSION=$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem dist
      # The release page shows only this version's notes: RELEASE_NOTES.md
      # keeps every release, newest first, separated by a line "---"; the
      # body is its first section (user, 2026-11-07: "just what is in that
      # specific release").
      # The release page is .github/RELEASE_TEMPLATE.md filled in: this
      # version's section of RELEASE_NOTES.md (never the whole history), the
      # links (CHANGELOG, issues as the roadmap, Discord, bug and feature
      # reports) and a thank-you list of the GitHub authors of every commit
      # since the previous release tag (user, 2026-11-07).
      - name: Release page from the template
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT_WINDOWS: ${{ needs.windows.result }}
          RESULT_LINUX: ${{ needs.linux.result }}
          RESULT_MACOS: ${{ needs.macos.result }}
          RESULT_FREEBSD: ${{ needs.freebsd.result }}
          RESULT_AUR: ${{ needs.aur.result }}
          RESULT_SNAP: ${{ needs.snap.result }}
          RESULT_FLATPAK: ${{ needs.flatpak.result }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(Get-Content RELEASE_NOTES.md | ForEach-Object { $_.TrimEnd() })
          $end = [Array]::IndexOf($lines, '---')
          if ($end -lt 0) { throw "RELEASE_NOTES.md has no '---' line: cannot tell this version's notes from the history" }
          if ($end -le 1) { throw "RELEASE_NOTES.md has no notes for this version before its first '---'" }
          $head = $lines[0].TrimStart([char]0xFEFF)
          if ($head -notmatch [regex]::Escape($env:CAMCRAFT_VERSION)) {
            throw "RELEASE_NOTES.md's first section is '$head', not $env:CAMCRAFT_VERSION - update the notes before tagging"
          }
          # The section without its own '# CamCraft X.Y.Z' title line (the
          # template names the version) and without trailing blank lines.
          $notes = @($lines[1..($end - 1)])
          $notes = ($notes -join "`n").Trim()
          if (-not $notes) { throw "RELEASE_NOTES.md's $env:CAMCRAFT_VERSION section is empty" }

          # Contributors: the GitHub login of every commit author since the
          # previous FEATURE release (the highest vX.Y.0 below this one) - the
          # old patch tags were markers that shipped nothing on GitHub, so
          # their contributors belong on this page.
          $cur = [version]($env:TAG.TrimStart('v'))
          $tags = @(gh api "repos/$env:REPO/tags" --paginate --jq '.[].name')
          if ($LASTEXITCODE -ne 0) { throw "could not list the repo's tags (gh api exit $LASTEXITCODE)" }
          $prev = $tags |
            Where-Object { $_ -match '^v\d+\.\d+\.0$' } |
            Where-Object { [version]($_.TrimStart('v')) -lt $cur } |
            Sort-Object { [version]($_.TrimStart('v')) } | Select-Object -Last 1
          $logins = @()
          if ($prev) {
            $logins = @(gh api "repos/$env:REPO/compare/$prev...$env:TAG" --paginate `
              --jq '.commits[] | .author.login // empty')
            if ($LASTEXITCODE -ne 0) { throw "could not compare $prev...$env:TAG (gh api exit $LASTEXITCODE)" }
          }
          $logins = @($logins | Where-Object { $_ -and $_ -notmatch '\[bot\]$' } | Sort-Object -Unique)
          $thanks = if ($logins.Count -gt 0) {
            ($logins | ForEach-Object { "- @$_" }) -join "`n"
          } else {
            "- everyone who reported, tested and discussed on the issues and on Discord"
          }

          $body = Get-Content -Raw .github/RELEASE_TEMPLATE.md
          foreach ($k in '{{VERSION}}', '{{TAG}}', '{{REPO_URL}}', '{{NOTES}}', '{{CONTRIBUTORS}}') {
            if (-not $body.Contains($k)) { throw ".github/RELEASE_TEMPLATE.md lost its $k placeholder" }
          }
          $body = $body.Replace('{{VERSION}}', $env:CAMCRAFT_VERSION)
          $body = $body.Replace('{{TAG}}', $env:TAG)
          $body = $body.Replace('{{REPO_URL}}', "https://github.com/$env:REPO")
          $body = $body.Replace('{{NOTES}}', $notes)
          $body = $body.Replace('{{CONTRIBUTORS}}', $thanks)

          # Every build job that did not succeed (failed, or skipped because
          # linux failed) is named on the page; the run itself stays red.
          $platforms = [ordered]@{
            'Windows (zip, installer)' = $env:RESULT_WINDOWS
            'Linux (tar.gz, deb, rpm, AppImage)' = $env:RESULT_LINUX
            'macOS (zip, dmg)' = $env:RESULT_MACOS
            'FreeBSD (tar.gz)' = $env:RESULT_FREEBSD
            'Arch (pkg.tar.zst)' = $env:RESULT_AUR
            'Snap' = $env:RESULT_SNAP
            'Flatpak' = $env:RESULT_FLATPAK
          }
          $missing = @($platforms.Keys | Where-Object { $platforms[$_] -ne 'success' })
          if ($missing.Count -gt 0) {
            $body = $body.TrimEnd() + "`n`n"
            foreach ($m in $missing) {
              $body += "> Not in this release: $m build did not succeed (job result: $($platforms[$m])) - see [the workflow run]($env:RUN_URL).`n"
            }
          }
          Set-Content -Encoding utf8 -NoNewline dist/release-body.md -Value $body
          Get-Content dist/release-body.md
      - name: At least one asset to publish
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/*.zip dist/*-setup.exe dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.dmg dist/*.AppImage dist/*.snap dist/*.flatpak dist/*.pkg.tar.zst)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no platform built an asset - nothing to publish"
            exit 1
          fi
          printf '%s\n' "${assets[@]}"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
            dist/*.AppImage
            dist/*.snap
            dist/*.flatpak
            dist/*.pkg.tar.zst
          body_path: dist/release-body.md
          # A failed platform leaves its globs empty; the step above already
          # refused a release with no asset at all.
          fail_on_unmatched_files: false

  wasm:
    # #1103: the browser shell (#31), built for wasm32 from this run's tree
    # by web/build-app-wasm.sh. Its own runner, so the Cargo.lock the build
    # rewrites for its flecs patch (#949) never reaches another job: only
    # target/web/ leaves it, as the wasm-app artifact. No rust-cache: tags
    # come weeks apart and an unused cache is evicted after 7 days.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install the wasm32 Rust target and the C toolchain
        # flecs' C is compiled by clang for wasm32 and archived by llvm-ar
        # (Ubuntu's LLVM has the wasm32 backend). The wasi sysroot is a
        # pinned, checksummed download inside the build script; the
        # wasm-bindgen CLI is installed there with --version and --locked.
        run: |
          rustup target add wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
          echo "CC_wasm32_unknown_unknown=clang-18" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=llvm-ar-18" >> "$GITHUB_ENV"
      - name: Build the browser shell
        run: bash web/build-app-wasm.sh --release
      - name: Check the page folder
        # The four files are there, the .wasm is a wasm module, and every
        # URL is relative to the page's folder (it is served at
        # <pages>/<repo>/app/, not at a site root).
        run: |
          bash web/check-app-page.sh target/web
          ls -l target/web
      - name: Cargo.lock untouched
        # The script puts the lock back on exit; say so if it did not, so
        # the next fix knows (nothing else is built from this checkout).
        if: always()
        run: git diff --quiet -- Cargo.lock || echo "::warning::web/build-app-wasm.sh left Cargo.lock modified (#949)"
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-app
          path: target/web/
          if-no-files-found: error

  site:
    # #688: the documentation site, built with Zola from this run's tree
    # (the tagged tree on a tag run). Read-only; a workflow_dispatch run
    # builds it as a check and deploys nothing.
    # #1103: waits for `wasm` whatever its result (but not on a cancelled
    # run), like `publish` waits for the platforms: a failed browser build
    # never withholds the docs.
    needs: [wasm]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Zola
        run: |
          curl -LfsS -o /tmp/zola.tar.gz https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-musl.tar.gz
          echo '7d77a4220a4f699cba2fc0e0c7859f780e887e269159ad4fab90e11ea16c906f  /tmp/zola.tar.gz' | sha256sum -c -
          tar -xzf /tmp/zola.tar.gz -C /tmp zola
          /tmp/zola --version
      - name: Version the site is built from
        # The workspace version is the release's version (the publish job
        # checks the tag names it too); the site's templates read it from
        # site/version.toml, which only this step writes (gitignored).
        shell: bash
        run: |
          ver=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$ver" ]; then echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name version v$ver"; exit 1
          fi
          printf 'version = "%s"\n' "$ver" > site/version.toml
          cat site/version.toml
      - uses: actions/download-artifact@v4
        # #1103: a download that fails only means "no browser build" (the
        # next step says so); it never withholds the docs.
        if: ${{ needs.wasm.result == 'success' }}
        continue-on-error: true
        with:
          name: wasm-app
          path: /tmp/wasm-app
      - name: Is there a browser build to publish
        # The front page claims the browser build only when it is deployed:
        # `app = true|false` in site/version.toml tells the templates. No
        # browser build (wasm job failed, nothing downloaded, or the page
        # check fails) is a warning by name, never a failed site.
        shell: bash
        env:
          WASM_RESULT: ${{ needs.wasm.result }}
        run: |
          app=false
          if [ "$WASM_RESULT" != success ]; then
            echo "::warning::Browser build missing: the wasm job did not succeed (result: $WASM_RESULT); the site goes out with app/ saying so"
          elif ! bash web/check-app-page.sh /tmp/wasm-app; then
            echo "::warning::Browser build missing: the wasm-app artifact did not download or failed web/check-app-page.sh; the site goes out with app/ saying so"
          else
            app=true
          fi
          printf 'app = %s\n' "$app" >> site/version.toml
          echo "CAMCRAFT_APP=$app" >> "$GITHUB_ENV"
          cat site/version.toml
      - name: Build the site
        # The project Pages URL of whichever repo runs this (a fork's own
        # Pages included), so every link resolves where it is deployed.
        # Zola writes app/ as the "not part of this copy" page; with a
        # browser build, the build's folder replaces it and is checked again
        # where it will be served. A copy that fails is dropped and the site
        # is built again saying the browser build is missing.
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          build() { (cd site && /tmp/zola build --base-url "https://${owner}.github.io/${repo}" && test -s public/index.html); }
          build
          if [ "$CAMCRAFT_APP" = true ]; then
            if ! { rm -rf site/public/app && cp -r /tmp/wasm-app site/public/app && bash web/check-app-page.sh site/public/app; }; then
              echo "::warning::Browser build missing: its copy at app/ failed web/check-app-page.sh; the site goes out with app/ saying so"
              sed -i 's/^app = true$/app = false/' site/version.toml
              build
            fi
          fi
          test -s site/public/app/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  pages:
    # #688: deploy the built site to GitHub Pages (repo setting: Pages
    # source "GitHub Actions"). Only on a tag, only when the site built and
    # the release page was published. The Pages write and OIDC token are
    # scoped to this job alone.
    needs: [site, publish]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.site.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
