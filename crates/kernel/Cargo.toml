[package]
name = "camcraft-kernel"
description = "The B-rep kernel seam (M12.1 stage 1): a thin trait over solidcore (the SMLib port) with a truck-backed reference impl, plus the dual-kernel agreement bench. No other crate depends on it yet. Clean-room implementation, public sources only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
# The truck reference impl (boolean via truck-shapeops, measure via
# truck-meshalgo tessellation). OFF by default: truck-shapeops 0.4.0 takes
# truck-meshalgo with its default features, which on native targets pull
# vtkio -> xz2 -> lzma-sys (C code) - the chain the workspace keeps off for
# camcraft-app. The bench turns it on through the dev-dependency below, so
# the C chain only builds for this crate's own tests.
truck = ["dep:truck-shapeops", "dep:truck-modeling", "dep:truck-meshalgo"]

[dependencies]
thiserror = { workspace = true }
# The SMLib port (tangency-labs, Apache-2.0, pure Rust, forbid(unsafe_code))
# and its STEP reader, at ONE commit of the owner's fork (#916): the STEP
# crate is unpublished and depends by path on the kernel beside it, so the
# kernel comes from the same tree. Always `rev = "<full sha>"` (the fork's
# tag camcraft-pin-2026-11-11), never a branch or tag name; moving the pin
# is the procedure in docs/decisions/916-solidcore-step-bench.md.
solidcore = { git = "https://github.com/NeoTech/solidcore", rev = "55d0e7638b9e1ebbf91ab8c10657e595c114ecda" }
solidcore-step = { git = "https://github.com/NeoTech/solidcore", rev = "55d0e7638b9e1ebbf91ab8c10657e595c114ecda" }
solidcore-convert = { git = "https://github.com/NeoTech/solidcore", rev = "55d0e7638b9e1ebbf91ab8c10657e595c114ecda" }
# The record type the STEP reader hands out, and solidcore's mesher over it
# (#940: the machining mesh, `machining_mesh`). Same commit as the kernel.
# solidcore-tess turns rayon off on wasm32 in its own manifest.
solidcore-record = { git = "https://github.com/NeoTech/solidcore", rev = "55d0e7638b9e1ebbf91ab8c10657e595c114ecda" }
solidcore-tess = { git = "https://github.com/NeoTech/solidcore", rev = "55d0e7638b9e1ebbf91ab8c10657e595c114ecda" }
truck-shapeops = { version = "=0.4.0", default-features = false, optional = true }
truck-modeling = { version = "=0.6.0", optional = true }
truck-meshalgo = { workspace = true, optional = true }

[dev-dependencies]
camcraft-kernel = { path = ".", features = ["truck"] }
# The STEP bench (#916, tests/step_agreement.rs) only: truck's STEP reader
# and mesher exactly as crates/app imports with them today (the workspace
# pins). Dev-only on purpose: the library gains no truck-stepio.
truck-stepio = { workspace = true }
truck-meshalgo = { workspace = true }
ruststep = { workspace = true }
