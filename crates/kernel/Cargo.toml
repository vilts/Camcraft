[package]
name = "camcraft-kernel"
description = "The B-rep kernel seam (M12.1 stage 1): a thin trait over solidcore (the SMLib port) with a truck-backed reference impl, plus the dual-kernel agreement bench. camcraft-geometry reads STEP and Solidcraft models through it. Clean-room implementation, public sources only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
# The truck reference impl (boolean via truck-shapeops, measure via
# truck-meshalgo tessellation). OFF by default: truck-shapeops 0.4.0 takes
# truck-meshalgo with its default features, which on native targets pull
# vtkio -> xz2 -> lzma-sys (C code) - the chain the workspace keeps off for
# camcraft-app. The bench turns it on through the dev-dependency below, so
# the C chain only builds for this crate's own tests.
truck = ["dep:truck-shapeops", "dep:truck-modeling", "dep:truck-meshalgo"]

[dependencies]
thiserror = { workspace = true }
# The Solidcraft reader (#1456): deflate for the .sc ZIP container (already
# in Cargo.lock through png/tiff), JSON for its manifests.
flate2 = "1.1"
serde_json = { workspace = true }
# The SMLib port (tangency-labs, Apache-2.0, pure Rust, forbid(unsafe_code))
# and its STEP reader, at ONE commit of the owner's fork (#916): the STEP
# crate is unpublished and depends by path on the kernel beside it, so the
# kernel comes from the same tree. Always `rev = "<full sha>"` (moved by #917 /
# #2781 to the fork's commit 2016386), never a branch or tag name; moving the pin
# is the procedure in docs/decisions/916-solidcore-step-bench.md.
solidcore = { git = "https://github.com/NeoTech/solidcore", rev = "fa67b3f560b7a8d59e99cb728f72f85e91dee2da" }
solidcore-step = { git = "https://github.com/NeoTech/solidcore", rev = "fa67b3f560b7a8d59e99cb728f72f85e91dee2da" }
solidcore-convert = { git = "https://github.com/NeoTech/solidcore", rev = "fa67b3f560b7a8d59e99cb728f72f85e91dee2da" }
# The `Trims` seam the STEP reader takes a pcurve kernel through (#917,
# `solidcore_trims`). Same commit; already in Cargo.lock through solidcore-step.
solidcore-ops = { git = "https://github.com/NeoTech/solidcore", rev = "fa67b3f560b7a8d59e99cb728f72f85e91dee2da" }
# The record type the STEP reader hands out, and solidcore's mesher over it
# (#940: the machining mesh, `machining_mesh`). Same commit as the kernel.
# solidcore-tess turns rayon off on wasm32 in its own manifest.
solidcore-record = { git = "https://github.com/NeoTech/solidcore", rev = "fa67b3f560b7a8d59e99cb728f72f85e91dee2da" }
solidcore-tess = { git = "https://github.com/NeoTech/solidcore", rev = "fa67b3f560b7a8d59e99cb728f72f85e91dee2da" }
truck-shapeops = { version = "=0.4.0", default-features = false, optional = true }
truck-modeling = { version = "=0.6.0", optional = true }
truck-meshalgo = { workspace = true, optional = true }

[dev-dependencies]
camcraft-kernel = { path = ".", features = ["truck"] }
# #2790: the STEP bench's truck side (truck-stepio, ruststep, truck-topology)
# is a recorded reading now (tests/step_agreement/rows.rs); no truck STEP
# crate is a dependency of this crate.
