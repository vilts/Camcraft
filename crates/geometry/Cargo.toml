[package]
name = "camcraft-geometry"
description = "The geometry seam of the M4.1 crate split: 3D mesh types and operations plus the 2D plane library. No ECS, no schema, no app types. Clean-room implementation, public sources only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# #163: library diagnostics are `tracing` events; the bin prints them on
# stderr through `tracing-subscriber`, as the app binaries do.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
clipper2-rust = { workspace = true }

# Native Solidcraft parser and machining mesh; see docs/decisions/1456-sc-open.md.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
camcraft-kernel = { path = "../kernel" }
