[package]
name = "camcraft-tools"
description = "The tool catalog types: one rotating cutter or hole-making cycle, described as data. Clean-room implementation, public sources only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# #163: library diagnostics are `tracing` events; the bin prints them on
# stderr through `tracing-subscriber`, as the app binaries do.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
camcraft-geometry = { path = "../geometry" }
serde = { workspace = true }
serde_json = { workspace = true }
