[workspace]
resolver = "3"
members = ["crates/app", "crates/cl", "crates/motion", "crates/post", "crates/sim",
  "crates/tools", "crates/ui", "crates/geometry", "crates/kernel", "xtask"]

[workspace.package]
version = "0.18.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
camcraft-app = { path = "crates/app" }
camcraft-geometry = { path = "crates/geometry" }
camcraft-cl = { path = "crates/cl" }
camcraft-tools = { path = "crates/tools" }
camcraft-post = { path = "crates/post" }
camcraft-sim = { path = "crates/sim" }
camcraft-motion = { path = "crates/motion" }

# ECS - alpha bindings, hard-pinned; expect churn on bumps.
# flecs_alerts is NOT optional: flecs_ecs_sys 0.2.1's bindings.rs references
# ecs_alert_desc_t ungated, so the sys crate only compiles with that feature on.
flecs_ecs = { version = "=0.2.2", default-features = false, features = ["flecs_base", "std", "flecs_alerts"] }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Data-parallel batch generation (M5.3 B): rayon's ordered collect keeps a
# parallel RegenerateAll byte-identical to the serial one. MIT OR
# Apache-2.0; pure Rust (its deps included), no build scripts of concern.
rayon = "1"

# Diagnostics to the launching terminal (#163): `tracing` events at the
# app's seams, printed by `tracing-subscriber`'s fmt layer on stderr and
# filtered by CAMCRAFT_LOG / RUST_LOG. Both MIT, pure Rust.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std", "tracing-log"] }

# The JS engine - one in the tree (M5.3 F): the post's sandbox (post/js.rs)
# and the job-script host (app/script) run the same hard-pinned boa.
boa_engine = "0.21.1"

# Platform + dialog deps shared with the UI stack; imgui retired at M1.4.2
# M-g (the dear-imgui-* trio left with it).
# No direct wgpu dep: camcraft-ui uses egui_wgpu::wgpu so types match the
# renderer exactly (wgpu is re-exported, version-selected by the set below).
winit = "0.30"
rfd = "0.15"
pollster = "0.4"
# wasm32 only (#31): the browser's monotonic clock behind std's Instant API
# (app/src/clock.rs). Already in the lock through winit/egui - no new crate.
# MIT OR Apache-2.0, pure Rust.
web-time = "1.1"
# macOS only (#144): the Objective-C runtime binding winit itself uses
# (same 0.5 line, already in the lock - no new crate), to give winit's
# app delegate an applicationShouldTerminate: so Cmd+Q asks first. MIT.
objc2 = "0.5"

# The shell (M1.4.2 graduation; was the M1.4.1 spike, decision in
# docs/spike-egui-go-no-go.md): egui stack, MIT OR Apache-2.0 (egui_dock: MIT) - notices in
# assets/ui/LICENSES.md.
# Hard-pinned AS A SET: egui_dock 0.21.1 wants egui ^0.36 (not 0.37), and
# 0.36.2 pins wgpu ^30.0 / winit ^0.30.13 - exactly our lock (30.0.1 /
# 0.30.13), so no forced upgrades. Bump together or hold
# (verified 2026-10-16 against crates.io). egui_kittest is dev-only and
# joined at S3, on the same set.
egui = "=0.36.2"
egui-winit = "=0.36.2"
egui-wgpu = "=0.36.2"
egui_dock = "=0.21.1"
egui_kittest = { version = "=0.36.2", features = ["wgpu", "snapshot"] }
# wasm32 only (#31): the browser shell. eframe's web runner owns the canvas,
# the DOM events and the awaited GPU start-up; wasm-bindgen exports the
# start function and wasm-bindgen-futures runs the awaits on the browser's
# event loop. All three were already in the lock (eframe through
# egui_kittest, the other two through wgpu) - no new crate. MIT OR
# Apache-2.0. eframe rides the egui set's hard pin; wasm-bindgen's version
# is what web/build-app-wasm.sh installs the matching CLI for.
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
# PNG decode for the UI icon set (assets/ui/*.png -> egui_app/icons.rs).
# Png only: everything else (formats, headers of other codecs) stays off.
image = { version = "0.25", default-features = false, features = ["png"] }
# PNG encode for the headless stock render (#182, app/src/raster.rs): the
# same png crate `image` already builds on, so no new crate in the tree.
png = "0.18"

# STEP reading - truck geometry stack (ricosjp), pure Rust, Apache-2.0. The
# Sept-2024 mutual version set; hard-pinned because the crates are alpha.
# meshalgo's default features pull vtkio -> lzma-sys (C code): keep it off and
# take only `tessellation` (which enables `filters` + spade, both pure Rust).
# Polygon booleans/offset - pure-Rust port (BSL-1.0) of the published Clipper2,
# backing crates/app/src/geo2d.rs. Hard-pinned (young project); the `clipper2`
# crate alternative is rejected because it builds C++ (our posture is pure Rust,
# same reasoning as meshalgo's off defaults above). Notice text in
# assets/ui/LICENSES.md.
clipper2-rust = "=1.2.0"

truck-stepio = "=0.3.0"
truck-topology = "=0.6.0"
truck-polymesh = "=0.6.0"
truck-meshalgo = { version = "=0.4.0", default-features = false, features = ["tessellation"] }
ruststep = "=0.4.0"

# #887: ruststep 0.4.0 - the newest crates.io release (Sept 2024) - cannot
# parse the empty parameter list `()`, which ISO 10303-21 allows, so HOOPS
# Exchange exports (one `DRAUGHTING_MODEL('',(),...)` entity) are rejected
# as corrupt. The fix is merged upstream but unreleased (ricosjp/ruststep#256
# asks for a release), so pin the fix commit via [patch.crates-io]. Upstream
# still declares version = "0.4.0", so camcraft-app's `=0.4.0` and
# truck-stepio's `0.4` both resolve to the patched crate unchanged, and
# ruststep-derive comes from the same tree. This is deliberately the only
# git dependency in the workspace (policy elsewhere: crates.io pins) and
# should be dropped once a ruststep release contains the fix.
# #1075: crates/app/src/geometry/import/step_depth.rs mirrors ruststep's
# tokenizer (strings, comments, `<...>`, binaries) to refuse deep nesting
# before ruststep's recursive parser overflows the stack, so that scan must
# be re-audited against ruststep's token.rs / exchange parser whenever this
# pin moves.
[patch.crates-io]
ruststep = { git = "https://github.com/ricosjp/ruststep", rev = "90fdc9351746f1f1d1e435b88f15371edaaaa14d" }

# Third-party code is optimized even in dev builds: an unoptimized truck
# tessellation or wgpu pass is 5-20x slower and makes imports feel like
# freezes. opt-level 1 is as fast as 2 on the compute-heavy suites (motion finish3d: 48.7 s vs 46.7 s;
# opt-level 0 is 3x slower) and cuts the cold dependency build (#900).
# Debug info is line tables only (file:line in panics and backtraces) and none for dependencies: the
# target/ is ~43% smaller. `--config profile.dev.debug=true` restores full info for a debugger session.
# Release is untouched.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
